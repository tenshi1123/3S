name: three_s
description: "Application for students of 3s exam preparation center"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.0
  otp_pin_field: ^1.2.9+1
  provider: ^6.1.2
  flutter_bloc: ^8.1.6
  persistent_bottom_nav_bar_v2: ^5.3.1
  smooth_page_indicator: ^1.2.0+3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter     
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
    - family: Inter-Italic
      fonts:
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf

